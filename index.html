// シャイゴースト：こっちを見ていない時だけ追いかけ、見つめると恥ずかしがって止まる
function stepGhosts(dt){
for(const h of ghosts){if(h.frozen>0){h.frozen=Math.max(0,h.frozen-dt);h.g.position.set(h.x,h.y,h.z);if(h.glitchFx){h.glitchFx.rotation.y+=dt*9;h.glitchFx.position.y=Math.sin(clock*25)*.15}if(h.frozen<=0&&h.glitchFx){h.g.remove(h.glitchFx);h.glitchFx=null}continue}if(pl.stealth>0){h.ph+=dt;h.g.position.set(h.x,h.y+Math.sin(h.ph)*.12,h.z);continue}const dx=pl.x-h.x,dy=pl.y+.8-h.y,dz=pl.z-h.z,d=Math.hypot(dx,dy,dz)||1,dxz=Math.hypot(dx,dz)||1;
const shy=(Math.cos(pl.yaw)*-dx-Math.sin(pl.yaw)*-dz)/dxz>.35;h.ph+=dt*3;const near=Math.abs(h.hi-(pl.pi||0))<=2;
if(!near){const hx=h.hx-h.x,hy=h.hy-h.y,hz=h.hz-h.z,hd=Math.hypot(hx,hy,hz);if(hd>.05){const m=Math.min(hd,3*dt);h.x+=hx/hd*m;h.y+=hy/hd*m;h.z+=hz/hd*m}}
else if(!shy){h.x+=dx/d*5*dt;h.y+=dy/d*3*dt;h.z+=dz/d*5*dt}
const u=h.g.userData;u.bm.opacity+=((shy?.45:1)-u.bm.opacity)*Math.min(1,dt*8);
u.hl.position.set(shy?.55:.25,shy?.18:-.25,shy?-.18:-.55);u.hr.position.set(shy?.55:.25,shy?.18:-.25,shy?.18:.55);u.mouth.visible=!shy;
h.g.position.set(h.x,h.y+Math.sin(h.ph)*.12,h.z);h.g.rotation.y=Math.atan2(-dz,dx);
if(!shy&&near&&d<1.05){if(hit())return true}}
ghosts=ghosts.filter(h=>{if(h.x<pl.x-35){lvl.remove(h.g);return false}return true});return false}

const joy={fx:0,fz:0,m:0},st=$('stick'),kn=$('knob');let joyId=null;
function joyMove(e){const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2-8;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;l=R}kn.style.transform='translate('+dx+'px,'+dy+'px)';const m=l/R;joy.m=m<.15?0:m;joy.fz=dx/R;joy.fx=-dy/R}
function joyEnd(){joyId=null;joy.m=0;joy.fx=joy.fz=0;kn.style.transform=''}
st.onpointerdown=e=>{e.preventDefault();joyId=e.pointerId;st.setPointerCapture(e.pointerId);joyMove(e)};
st.onpointermove=e=>{if(e.pointerId===joyId)joyMove(e)};
st.onpointerup=st.onpointercancel=e=>{if(e.pointerId===joyId)joyEnd()};
let ctrl='key';try{ctrl=localStorage.getItem('fallCtrl')||(matchMedia('(hover:none),(pointer:coarse)').matches?'tap':'key')}catch(e){}
function setCtrl(c){ctrl=c;keys={};joyEnd();document.body.classList.toggle('tap',c==='tap');$('ctrlBtn').textContent='🎮 操作：'+(c==='tap'?'タップ':'キーボード');try{localStorage.setItem('fallCtrl',c)}catch(e){}}
function toggleCtrl(){setCtrl(ctrl==='tap'?'key':'tap')}setCtrl(ctrl);
const pvRen=new T.WebGLRenderer({canvas:$('pv'),antialias:true,alpha:true}),pvScene=new T.Scene(),pvCam=new T.PerspectiveCamera(38,1,.1,50);
pvRen.setPixelRatio(2);pvRen.setSize(200,200,false);pvScene.add(new T.HemisphereLight(0xffffff,0x6688aa,1.1));const pdl=new T.DirectionalLight(0xffffff,.6);pdl.position.set(3,4,2);pvScene.add(pdl);pvCam.position.set(3.4,.95,0);pvCam.lookAt(0,.75,0);
function renderShop(){const s=SKINS.find(x=>x.id===selSkin)||SKINS[0];if(pvAv)pvScene.remove(pvAv);pvAv=makeAvatar(s.id);pvScene.add(pvAv);
$('shopGems').textContent='💎 '+gems;$('shopName').textContent=s.name;$('shopDesc').textContent=(s.desc||'')+'\n'+(s.id==='def'?'特性：なし':s.id==='gold'?'特性：ポイント2倍':(ABILITY_TEXT[s.id]||'特性：範囲衝撃波で周囲の敵を攻撃。')+' 1ゲーム最大3回')+'\n'+(curSkin===s.id?'✅ 現在装備中':owned.includes(s.id)?'🟢 購入済み・装備可能':s.price===0?'🎁 無料':`💎 ${s.price} クリスタル`);$('shopDesc').style.whiteSpace='pre-line';
const L=$('shopList'),q=($('shopSearch').value||'').trim().toLowerCase();L.innerHTML='';const shown=SKINS.filter(k=>k.name.toLowerCase().includes(q)||String(k.price).includes(q)||k.desc.toLowerCase().includes(q));$('shopCount').textContent=`スキン ${shown.length} / ${SKINS.length} 種類　・　選んで詳細を確認！`;shown.forEach(k=>{const b=document.createElement('button');b.className=k.id===selSkin?'selected':'';const status=curSkin===k.id?'👕 装備中':owned.includes(k.id)?'✅ 所持':k.price===0?'🎁 無料':`💎 ${k.price}`;b.innerHTML=`<span class="skinName">${k.name}</span><span class="skinMeta">${status}</span>`;b.onclick=()=>{selSkin=k.id;renderShop()};L.appendChild(b)});
const a=$('shopAct');if(curSkin===s.id){a.textContent='✅ 装備中';a.disabled=true}else if(owned.includes(s.id)){a.textContent='👕 このスキンを装備';a.disabled=false}else{a.textContent=s.price===0?'🎁 無料で入手':`💎 ${s.price} で購入`;a.disabled=gems<s.price}}
function shopAct(){const s=SKINS.find(x=>x.id===selSkin);if(!owned.includes(s.id)){if(gems<s.price)return;gems-=s.price;owned.push(s.id)}const prevSkin=curSkin;curSkin=s.id;equip();if(curSkin==='golem'&&prevSkin!=='golem'){abilityUses=Math.max(abilityUses,8);pl.big=true}saveAll();updateHUD();updateAbilityButton();renderShop()}
function openShop(){shopOpen=true;keys={};selSkin=curSkin;$('shopSearch').value='';$('shop').style.display='flex';renderShop()}
function closeShop(){shopOpen=false;$('shop').style.display='none'}
build();requestAnimationFrame(loop);
</script>
